[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "captionforge"
version = "1.0.1"
description = "Local, auditable ComfyUI captioning for LoRA datasets: multi-witness evidence, text-LLM synthesis, image-aware VLM validation, and LONG/SHORT/TAGGY exports."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "J. L. Córdova", email = "jose.l.cordova@gmail.com" }
]
maintainers = [
    { name = "J. L. Córdova", email = "jose.l.cordova@gmail.com" }
]
keywords = [
    "comfyui",
    "comfyui-nodes",
    "comfyui-custom-nodes",
    "captioning",
    "caption-generation",
    "dataset-captioning",
    "dataset-preparation",
    "image-captioning",
    "image-dataset",
    "lora",
    "lora-training",
    "vision-language-models",
    "vlm",
    "vlm-validation",
    "llm",
    "multimodal-ai",
    "ollama",
    "huggingface",
    "qwen",
    "joycaption",
    "jsonl",
    "audit-trail",
    "local-ai",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch",
    "transformers",
    "accelerate",
    "huggingface-hub",
    "pillow",
    "numpy",
    "safetensors",
    "qwen-vl-utils",
]

[project.optional-dependencies]
quantization = [
    "bitsandbytes",
]

dev = [
    "ruff",
    "black",
]

[project.urls]
Homepage = "https://github.com/Damkohler/CaptionForge"
Repository = "https://github.com/Damkohler/CaptionForge"
Issues = "https://github.com/Damkohler/CaptionForge/issues"

[tool.comfy]
supported_comfyui_version = ">=0.2"
PublisherId = "damkohler"
DisplayName = "CaptionForge"
Icon = "https://raw.githubusercontent.com/Damkohler/CaptionForge/main/assets/icons/jlc-comfyui-nodes_Logo-0512.png"
Category = "nodes"
Homepage = "https://github.com/Damkohler/CaptionForge"

[tool.setuptools]
include-package-data = false
packages = [
    "CaptionForge",
    "CaptionForge.engines",
    "CaptionForge.nodes",
    "CaptionForge.nodes.caption_nodes",
]

[tool.setuptools.package-dir]
CaptionForge = "."
"CaptionForge.engines" = "engines"
"CaptionForge.nodes" = "nodes"
"CaptionForge.nodes.caption_nodes" = "nodes/caption_nodes"

[tool.setuptools.package-data]
CaptionForge = [
    "config/*.json",
    "assets/icons/*",
    "assets/workflows/*",
    "web/**/*",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
